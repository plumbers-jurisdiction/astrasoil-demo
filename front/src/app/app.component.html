<main class="farmer-page">
  <header class="site-header">
    <a class="logo" href="#inicio" aria-label="AstraSoil home"
      ><span class="logo-mark"><span class="orbit"></span><span class="seed"></span></span
      ><span>astra<span class="logo-accent">soil</span></span></a
    >
  </header>
  <app-field-section
    [generating]="loading"
    (generate)="generateRotations($event)"
  ></app-field-section>

  <app-rotation-section
    [rotations]="rotations"
    [loading]="loading"
    [error]="rotationError"
    [attempted]="attempted"
  ></app-rotation-section>

  <footer class="site-footer">
    <a class="logo" href="#inicio"
      ><span class="logo-mark"><span class="orbit"></span><span class="seed"></span></span
      ><span>astra<span class="logo-accent">soil</span></span></a
    ><span>Earth intelligence for resilient agriculture.</span><span>© 2026 AstraSoil</span>
  </footer>
</main>
