name: CI-CD Back

on:
  pull_request:
    branches: [main]
    paths: &back
      - "back/**"
      - "!back/**.md"
      - ".github/workflows/ci-cd-back.yml"
  push:
    branches: [main]
    paths: *back

concurrency:
  group: ci-cd-back-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 27
          cache: maven
          cache-dependency-path: back/pom.xml
      - run: ./mvnw -B test

  deploy:
    name: Deploy to Render
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
