server:
  port: ${PORT:8080}

spring:
  application:
    name: astrasoil
  profiles:
    # The demo profile (application-demo.yaml) is used unless another profile is set with SPRING_PROFILES_ACTIVE.
    # Production sets its own profile, so no demo-only behavior (@ConditionalOnDemo) runs there.
    default: demo
  output:
    ansi:
      enabled: always
  mvc:
    apiversion:
      use:
        path-segment: 0
  cloud:
    openfeign:
      client:
        config:
          # Timeouts (ms) for every Feign client; override one under its client name (e.g. usda-plants:)
          default:
            connect-timeout: 10000
            read-timeout: 30000

logging:
  pattern:
    console: "%clr([%d{yyyy-MM-dd HH:mm:ss.SSS}]){faint} %clr([%-5p]) %clr([%logger{0}]){cyan} %m%n%wEx"

astrasoil:
  cors:
    # Addresses the front-end is served from, comma-separated (e.g. https://astrasoil.onrender.com,http://localhost:5173).
    # "*" lets any address call the API: open until the front-end's URL is known.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  usda-plants:
    url: ${USDA_PLANTS_URL:https://plantsservices.sc.egov.usda.gov/api}
    # How many crops are searched at the same time; kept low to be polite to a free government API
    max-parallel-requests: ${USDA_PLANTS_MAX_PARALLEL_REQUESTS:4}
  nasa-power:
    url: ${NASA_POWER_URL:https://power.larc.nasa.gov/api}
    # POWER returns intermittent server errors: each request is tried up to max-attempts times,
    # waiting retry-wait-millis x the attempt number between tries (1 s, then 2 s by default)
    max-attempts: ${NASA_POWER_MAX_ATTEMPTS:3}
    retry-wait-millis: ${NASA_POWER_RETRY_WAIT_MILLIS:1000}
  climate:
    # Baseline window: from this year to the year before the recent window (comparison only, e.g. rain change).
    # NASA POWER's daily weather starts in 1981.
    baseline-start-year: ${CLIMATE_BASELINE_START_YEAR:1991}
    # Recent window: the last N complete years, which drive the analysis (15 follows NOAA's recent rainfall normals)
    recent-years: ${CLIMATE_RECENT_YEARS:15}
